<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idea Forge - Creative Catalyst</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/animations.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script type="importmap">
    {
      "imports": {
        "sortablejs": "https://cdn.skypack.dev/sortablejs"
      }
    }
    </script>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <div class="logo-section">
                    <div class="logo-icon">⚡</div>
                    <h1 class="app-title">Idea Forge</h1>
                </div>
                <div class="header-actions">
                    <div class="project-switcher">
                        <span id="current-project-name">No Project</span>
                        <button class="btn btn-secondary" id="project-btn">Projects</button>
                        <button class="btn btn-icon" id="new-project-btn" title="New Project">+</button>
                    </div>
                    <button class="btn btn-secondary" id="export-btn">Export Project</button>
                    <button class="btn btn-primary" id="generate-btn">✨ Generate</button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Input Section -->
            <section class="input-section">
                <div class="input-container">
                    <textarea 
                        id="concept-input" 
                        placeholder="Describe your idea, concept, or design brief... Be as vague or detailed as you like!"
                        class="concept-textarea"
                    ></textarea>
                    <div class="input-actions">
                        <div class="selection-info" id="selection-info" style="display: none;">
                            <span id="selection-count">0</span> cards selected
                            <button class="btn btn-ghost btn-small" id="clear-selection-btn">Clear</button>
                        </div>
                        <button class="btn btn-ghost" id="clear-input">Clear</button>
                        <button class="btn btn-primary" id="process-concept">Process Concept</button>
                    </div>
                </div>
            </section>

            <!-- Cards Container -->
            <section class="cards-section">
                <div class="section-header">
                    <h2>Design Components</h2>
                    <div class="section-actions">
                        <button class="btn btn-icon" id="toggle-view-btn" title="Toggle Compact View">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-grid-3x3-gap-fill" viewBox="0 0 16 16">
                                <path d="M1 2a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1zm5 0a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1zm5 0a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1zM1 7a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1zm5 0a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1zm5 0a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1z"/>
                        </button>
                        <button class="btn btn-ghost" id="add-category">+ Category</button>
                        <button class="btn btn-ghost" id="add-card">+ Card</button>
                    </div>
                </div>
                <div class="filter-controls" id="filter-controls">
                    <!-- Filters will be dynamically generated here -->
                </div>
                <div class="cards-container" id="cards-container">
                    <!-- Cards will be dynamically generated here -->
                </div>
            </section>

            <!-- AI Chat Panel -->
            <aside class="ai-panel" id="ai-panel">
                <div class="ai-header">
                    <h3>AI Assistant</h3>
                    <button class="btn-icon" id="toggle-ai">×</button>
                </div>
                <div class="ai-chat" id="ai-chat">
                    <div class="chat-messages" id="chat-messages"></div>
                    <div class="chat-input-container">
                        <input type="text" id="chat-input" placeholder="Ask for suggestions, refinements, or new ideas...">
                        <button class="btn btn-primary" id="send-chat">Send</button>
                    </div>
                </div>
            </aside>
        </main>

        <!-- Context Dock -->
        <div class="context-dock" id="context-dock">
            <div class="dock-header" id="dock-header">
                <h4>Selected Context (<span id="dock-count">0</span>)</h4>
                <button class="btn-icon" id="toggle-dock-btn" title="Toggle Context Dock">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                        <path fill-rule="evenodd" d="M7.646 4.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1-.708.708L8 5.707l-5.646 5.647a.5.5 0 0 1-.708-.708z"/>
                    </svg>
                </button>
            </div>
            <div class="dock-content" id="dock-content">
                <div class="dock-placeholder" id="dock-placeholder">Click on cards or drag them here to add them to your context.</div>
            </div>
        </div>

        <!-- Floating Action Button -->
        <button class="fab" id="fab" title="Open AI Assistant">
            <span class="fab-icon">🤖</span>
        </button>

        <!-- Modal Overlay -->
        <div class="modal-overlay" id="modal-overlay">
            <div class="modal" id="modal">
                <div class="modal-header">
                    <h3 id="modal-title">Modal Title</h3>
                    <button class="btn-icon" id="close-modal">×</button>
                </div>
                <div class="modal-content" id="modal-content">
                    <!-- Dynamic modal content -->
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="app.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
